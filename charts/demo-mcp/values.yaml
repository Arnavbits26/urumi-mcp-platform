# Used twice, with deploy/values-mcp-notes.yaml and deploy/values-mcp-utils.yaml.
name: mcp-demo                  # names every resource; set per release

image:
  repository: urumi/mcp-demo
  tag: dev
  pullPolicy: IfNotPresent      # local images are imported into k3d, never pulled

port: 8000

# The credential the gateway must present. The Secret is created by scripts/mcp-demo-secrets.sh.
secret:
  name: demo-credentials
  key: token
  env: AUTH_TOKEN               # the environment variable the server reads it from

env: {}                         # extra plain-text settings

persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  mountPath: /data

# Only these peers may connect. Empty means nobody, so each values file names the gateway.
networkPolicy:
  enabled: true
  allowFrom: []

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits:   { cpu: 300m, memory: 192Mi }
