host: gateway.localtest.me

image:
  repository: urumi/gateway
  tag: dev
  pullPolicy: IfNotPresent

# Secret created by scripts/gateway-secrets.sh. Keys: postgres-password, encryption-key, bootstrap-admin-key
secretName: gateway-secrets
bootstrapAdminEmail: admin@example.com

# Registered on first start (an admin can edit or remove them afterwards).
seedServers:
  - slug: woocommerce
    name: WooCommerce
    url: http://wc-mcp.store.svc.cluster.local:8000/mcp

# Set to true once the site is served over https, so the browser only sends the login cookie over https.
cookieSecure: false

# The chat assistant uses any OpenAI-compatible AI service. The key is NOT here: it lives in the Secret
# below, created by scripts/llm-secret.sh (key name: api-key). Without it the chat shows a setup note.
llm:
  baseUrl: https://api.groq.com/openai/v1
  model: llama-3.3-70b-versatile
  secretName: llm-credentials

dashboard:
  image:
    repository: urumi/dashboard
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 96Mi }

settings:
  callTimeoutSeconds: 30
  connectTimeoutSeconds: 5
  refreshTimeoutSeconds: 10
  refreshIntervalSeconds: 15
  failThreshold: 2

ingress:
  enabled: true
  className: traefik
  annotations: {}
  tls:
    enabled: false
    secretName: ""

persistence:
  storageClass: ""
  size: 2Gi

postgres:
  image: postgres:16-alpine
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 384Mi }

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 384Mi }
