apiVersion: v1
kind: Service
metadata:
  name: gateway-backend
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-backend
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-backend
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
        app.kubernetes.io/name: gateway-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway-backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: DB_HOST, value: postgres }
            - { name: DB_NAME, value: gateway }
            - { name: DB_USER, value: gateway }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: postgres-password }
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: encryption-key }
            - name: BOOTSTRAP_ADMIN_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: bootstrap-admin-key }
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: bootstrap-admin-password, optional: true }
            - { name: COOKIE_SECURE, value: {{ .Values.cookieSecure | quote }} }
            - { name: LLM_BASE_URL, value: {{ .Values.llm.baseUrl | quote }} }
            - { name: LLM_MODEL, value: {{ .Values.llm.model | quote }} }
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.llm.secretName }}, key: api-key, optional: true }
            - { name: BOOTSTRAP_ADMIN_EMAIL, value: {{ .Values.bootstrapAdminEmail | quote }} }
            - { name: SEED_SERVERS, value: {{ .Values.seedServers | toJson | quote }} }
            - { name: CALL_TIMEOUT_SECONDS, value: {{ .Values.settings.callTimeoutSeconds | quote }} }
            - { name: CONNECT_TIMEOUT_SECONDS, value: {{ .Values.settings.connectTimeoutSeconds | quote }} }
            - { name: REFRESH_TIMEOUT_SECONDS, value: {{ .Values.settings.refreshTimeoutSeconds | quote }} }
            - { name: REFRESH_INTERVAL_SECONDS, value: {{ .Values.settings.refreshIntervalSeconds | quote }} }
            - { name: FAIL_THRESHOLD, value: {{ .Values.settings.failThreshold | quote }} }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
