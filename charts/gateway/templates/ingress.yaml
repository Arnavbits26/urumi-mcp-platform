{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          # The API and the MCP endpoint go to the gateway; everything else is the dashboard.
          # Traefik and nginx both pick the longest matching prefix.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-backend
                port:
                  name: http
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: gateway-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  name: http
{{- end }}
