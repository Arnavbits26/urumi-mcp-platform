server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No inline scripts or styles are used, so the policy can be strict. Everything comes from this origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # MCP clients probe /.well-known/... after a 401 to look for OAuth. Answer with a real 404 instead of
  # the app's HTML page, so they fall back to the API-key header cleanly.
  location /.well-known/ {
    return 404;
  }

  # Built files have content hashes in their names, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Everything else is the single-page app. index.html itself must never be cached.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
