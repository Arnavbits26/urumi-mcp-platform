# STORE chart on a production-like server (a VM or VPS running k3s).
# The domain is NOT written here: scripts/prod/deploy.sh sets `host` and `siteUrl` from BASE_DOMAIN.
# No secrets belong in this file; they are created in the cluster by scripts/*-secrets.sh.
ingress:
  className: traefik            # k3s ships Traefik
persistence:
  storageClass: local-path      # k3s default. On a cloud, use its block-storage class instead.
  wordpress: { size: 5Gi }
  mariadb:   { size: 5Gi }
